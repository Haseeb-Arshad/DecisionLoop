# Copy .env.production.example to .env.production and set its secrets first.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: decisionloop
      POSTGRES_DB: decisionloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [decisionloop-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionloop"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: decisionloop:local
    build: .
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://decisionloop:${POSTGRES_PASSWORD}@postgres:5432/decisionloop?sslmode=disable
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  web:
    image: decisionloop:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://decisionloop:${POSTGRES_PASSWORD}@postgres:5432/decisionloop?sslmode=disable
      DECISIONLOOP_DISABLE_WORKER: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: decisionloop:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://decisionloop:${POSTGRES_PASSWORD}@postgres:5432/decisionloop?sslmode=disable
    command: ["node", "bin/decisionloop.mjs", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  decisionloop-pg:
