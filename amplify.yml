version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # db:migrate is safe to run on every deploy — every migration is
            # tracked in schema_migrations and applied at most once (see
            # db/migrate.ts). Requires DATABASE_URL to be set as an Amplify
            # environment variable.
            - npm run db:migrate
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
